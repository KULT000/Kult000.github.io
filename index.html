<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gallery, research and workshop for contemporary culture.">
  <title>KULT [000]</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    main {
      min-height: 100vh;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .index {
      font-size: 12px;
    }

    .statement {
      max-width: 520px;
      margin-top: 20vh;
      margin-bottom: 20vh;
    }

    .statement p {
      margin: 0;
      font-size: clamp(24px, 4vw, 48px);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }

    nav a {
      color: #000;
      text-decoration: none;
      padding: 12px 0;
    }

    nav a:hover {
      text-decoration: underline;
    }

    footer {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      main {
        padding: 20px;
      }

      nav {
        grid-template-columns: 1fr;
      }

      nav a {
        border-bottom: 1px solid #000;
      }

      nav a:last-child {
        border-bottom: none;
      }

      footer {
        display: block;
      }

      footer div {
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>

  <main>

    <div>
      <header>
        <div class="logo">KULT</div>
        <div class="index">[000]</div>
      </header>

      <section class="statement">
        <p>
          A gallery, research and workshop for contemporary culture.
        </p>
      </section>

      <nav>
        <a href="#gallery">GALLERY</a>
        <a href="#research">RESEARCH</a>
        <a href="#workshop">WORKSHOP</a>
      </nav>
    </div>

    <footer>
      <div>KULT 000</div>
      <div>
        <a href="https://instagram.com/kult000" target="_blank">INSTAGRAM</a>
        &nbsp;&nbsp;
        <a href="#" target="_blank">SUBSTACK</a>
        &nbsp;&nbsp;
        <a href="mailto:">EMAIL</a>
      </div>
    </footer>

  </main>

</body>
</html>
